[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[project]
name = "web-boardimage"
version = "0.1.0"
description = "An HTTP service that renders chess board images"
readme = "README.md"
authors = [
    { name = "Niklas Fiekas", email = "niklas.fiekas@backscattering.de" },
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp~=3.14.3",
    "chess @ git+https://github.com/hyprchs/python-chess.git@3991629484aab14ae31ba6b64b719d0d8114ac54",
    "resvg_py==0.3.3",
]

[dependency-groups]
dev = [
    "Pillow>=10.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = ["web_boardimage"]
module-root = "."

[tool.uv.sources]
chess = { path = "python-chess", editable = true }
